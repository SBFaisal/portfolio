<section class="section not-found" aria-labelledby="not-found-title">
  <article class="terminal-shell glass-card shadow-smooth" role="region" aria-label="Terminal styled 404 error">
    <header class="terminal-topbar" aria-hidden="true">
      <span class="dot dot-close"></span>
      <span class="dot dot-min"></span>
      <span class="dot dot-max"></span>
      <p>portfolio://routes/not-found</p>
    </header>

    <div class="terminal-body">
      <p class="line"><span class="prompt">visitor&#64;portfolio:~$</span> open /requested/route</p>
      <p class="line error" id="not-found-title">404: Page not found</p>
      <p class="line"><span class="prompt">system:</span> The route you requested does not exist or may have moved.</p>
      <p class="line"><span class="prompt">hint:</span> Use the command below to return to safety.</p>

      <div class="actions">
        <a class="btn-home" routerLink="/home">cd /home</a>
      </div>
    </div>
  </article>
</section>
