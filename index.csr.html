    #app-loading-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      background: linear-gradient(160deg, #0a0a0a, #111827);
      color: #f8fafc;
      z-index: 5000;
      transition: opacity 260ms ease;
    }

    #app-loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-loading-screen .dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      margin: 0 auto;
      background: linear-gradient(120deg, #00d4ff, #6c63ff);
      animation: loading-pulse 1s ease-in-out infinite;
    }

    @keyframes loading-pulse {
      0%,
      100% {
        transform: scale(0.85);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading-screen,
      #app-loading-screen .dot {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
